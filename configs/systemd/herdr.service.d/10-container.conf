# Drop-in for distrobox-exported herdr.service. Keep the exported unit untouched:
# a re-export rewrites it, but leaves this drop-in in place.
# Installed by scripts/17-container-boot.sh (module: boxboot).
[Unit]
Requires=arch-omarchy-container.service
After=arch-omarchy-container.service
StartLimitIntervalSec=300
StartLimitBurst=5
