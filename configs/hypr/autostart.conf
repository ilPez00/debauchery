# autostart.conf — air (translated from niri spawn-at-startup / environment)

# DMS runs as a systemd user service (WantedBy=graphical-session.target).
# niri-session starts that target; start-hyprland does not, so do it here —
# otherwise the session comes up with no bar, dock or menus.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP
exec-once = systemctl --user start graphical-session.target

exec-once = /home/gio/.local/bin/physis-selector
