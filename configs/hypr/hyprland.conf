# hyprland.conf — air
# Translated from niri + DMS. See ~/debauchery/MIGRATION-niri-to-hyprland.md
# DMS starts as a systemd user service (graphical-session.target); no exec-once needed.
# Hyprland 0.55: hyprlang configs still work (Lua is the future; migrate later).

# Modifier variables. The rest of this config writes SUPER literally; $mainMod is
# defined for sourced files that use the Omarchy convention (e.g. the Physis
# adapter's physis-omarchy.conf). Hyprland silently substitutes an undefined
# variable with an empty string, which would turn those binds into bare keys.
$mainMod = SUPER

source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf
source = ~/.config/hypr/extra.conf

env = XDG_CURRENT_DESKTOP,Hyprland

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(42a5f5ff) rgba(42a5f5ff) 45deg
    col.inactive_border = rgba(8c9199aa)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 12
    }
    active_opacity = 1.0
    inactive_opacity = 0.95
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, myBezier
    animation = workspaces, 1, 4, myBezier, slide
    animation = fade, 1, 4, myBezier
}

input {
    kb_layout = us
    repeat_rate = 50
    repeat_delay = 300
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
    sensitivity = 0.0
}

misc {
    force_default_wallpaper = 0
}

dwindle {
    preserve_split = true
}
