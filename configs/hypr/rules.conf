# rules.conf — window rules translated from DMS/niri
# Hyprland 0.53+ windowrule syntax (windowrulev2 is deprecated).

# DMS's own layer-shell windows: floating, opaque
windowrule {
    name = dms-floating
    match:class = ^(dev\.duxlabs\.shell|com\.danklinux\.dms)$
    float = on
    opacity = 1.0
}

# Small utilities: floating
windowrule {
    name = utilities-floating
    match:class = ^(org\.gnome\.Calculator|gnome-calculator|galculator|blueman-manager|xdg-desktop-portal)$
    float = on
}

# Picture-in-Picture: floating, on top
windowrule {
    name = pip
    match:title = ^Picture-in-Picture$
    float = on
    pin = on
}
