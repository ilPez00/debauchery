# rules.conf — window rules translated from DMS/niri
# Hyprland 0.53+ `windowrule {}` syntax (windowrulev2 is deprecated).
# Sourced from hyprland.conf; repo copy ~/debauchery/configs/hypr/rules.conf,
# deployed by scripts/02-hyprland-config.sh. Hyprland auto-reloads on save, or
# run `hyprctl reload`.
#
# HOW TO CHANGE A SPAWN RULE
#   Match a window, then say where/how it opens. Keys:
#     match:class        regex on the app-id (Wayland) / WM_CLASS (XWayland)
#     match:title        regex on the window title
#     match:initialClass / match:initialTitle   the values at map time
#     workspace = N|name  open on that workspace (name must exist)
#     float  = on         do not tile it
#     tile   = on         force tiling
#     size   = WxH        initial size
#     move   = X Y        initial position
#     monitor = name      open on a given output (hyprctl monitors)
#     center = on         center the window on its workspace
#     pin    = on         keep on top, visible on every workspace
#     opacity = 0.95       window opacity
#     keepaspectratio = on
#   Find a window's class/title with:  hyprctl clients -j
#   (fields: class, title, initialClass, initialTitle).
#
#   NOTE: the DMS window-rules panel (Super+Shift+W) and `dms config windowrules
#   ...` write to a Lua config and need ~/.config/hypr/hyprland.lua, which does
#   not exist while this config is hyprlang — edit this file instead.

# DMS's own layer-shell windows: floating, opaque
windowrule {
    name = dms-floating
    match:class = ^(dev\.duxlabs\.shell|com\.danklinux\.dms)$
    float = on
    opacity = 1.0
}

# Small utilities: floating
windowrule {
    name = utilities-floating
    match:class = ^(org\.gnome\.Calculator|gnome-calculator|galculator|blueman-manager|xdg-desktop-portal)$
    float = on
}

# Picture-in-Picture: floating, on top
windowrule {
    name = pip
    match:title = ^Picture-in-Picture$
    float = on
    pin = on
}

