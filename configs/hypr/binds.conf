# binds.conf — air (Hyprland)
# Translated from niri + DMS. See ~/debauchery/MIGRATION-niri-to-hyprland.md
# Verified keysyms via libxkbcommon; verified DMS IPC targets via `dms ipc --help`.
# bind = one-shot; binde = repeat while held (niri's default repeat).
#
# EDITING YOUR SHORTCUTS
#   This file is the editable keybind source (repo copy:
#   ~/debauchery/configs/hypr/binds.conf, deployed by scripts/02-hyprland-config.sh).
#   Hyprland auto-reloads on save (misc:disable_autoreload = false); `hyprctl reload`
#   does it by hand. Syntax: bind = MODS, key, dispatcher, arg
#     MODS   SUPER SHIFT CTRL ALT (space-separated; empty = `bind = , key, ...`)
#     binde  repeat while held      bindm  mouse drag (movewindow/resizewindow)
#     bindr  fire on release        submap blocks for modal bindings
#   Key names are X11 keysyms: H J K L, Left Right Up Down, Tab, Escape, Space,
#   Return, F1..F12, Equal, Minus, BracketLeft/Right, Period, Comma, Backslash,
#   Print, Delete, Home, End, Page_Up/Down, mouse:272/273. Run `dms keybinds keymap`
#   to see what each physical key sends.
#   NOTE: the DMS keybinds overlay (Super+Y) and `dms keybinds set hyprland ...`
#   read a Lua config (~/.config/hypr/hyprland.lua), which does not exist while
#   this config is hyprlang — so edit this file instead (see notes/2026-11-13.md).

# ============================ Workspaces ============================
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# cycle workspaces: Super+Tab next, Super+Shift+Tab previous (wraps around)
bind = SUPER, Tab, workspace, e+1
bind = SUPER SHIFT, Tab, workspace, e-1

# focus workspace up/down (niri Mod+I / Mod+U / Page_Up / Page_Down / wheel)
binde = SUPER, I, workspace, e+1
binde = SUPER, U, workspace, e-1
binde = SUPER, Page_Up, workspace, e+1
binde = SUPER, Page_Down, workspace, e-1
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1

# move window to workspace up/down (niri Mod+Ctrl+I/U + wheel)
bind = SUPER CTRL, I, movetoworkspace, e+1
bind = SUPER CTRL, U, movetoworkspace, e-1
bind = SUPER CTRL, mouse_up, movetoworkspace, e-1
bind = SUPER CTRL, mouse_down, movetoworkspace, e+1

# focus column left/right (niri wheel variants)
bind = SUPER, mouse_up, movefocus, l
bind = SUPER, mouse_down, movefocus, r
bind = SUPER SHIFT, mouse_up, movefocus, l
bind = SUPER SHIFT, mouse_down, movefocus, r

# move column left/right (niri Mod+Ctrl+wheel)
bind = SUPER CTRL, mouse_up, movewindow, l
bind = SUPER CTRL, mouse_down, movewindow, r

# ============================ Focus ============================
binde = SUPER, H, movefocus, l
binde = SUPER, J, movefocus, d
binde = SUPER, K, movefocus, u
binde = SUPER, L, movefocus, r
binde = SUPER, Left, movefocus, l
binde = SUPER, Down, movefocus, d
binde = SUPER, Up, movefocus, u
binde = SUPER, Right, movefocus, r

# column first/last (approximate: hold to walk)
binde = SUPER, Home, movefocus, l
binde = SUPER, End, movefocus, r

# ============================ Move windows ============================
binde = SUPER SHIFT, H, movewindow, l
binde = SUPER SHIFT, J, movewindow, d
binde = SUPER SHIFT, K, movewindow, u
binde = SUPER SHIFT, L, movewindow, r
binde = SUPER SHIFT, Left, movewindow, l
binde = SUPER SHIFT, Down, movewindow, d
binde = SUPER SHIFT, Up, movewindow, u
binde = SUPER SHIFT, Right, movewindow, r

# ============================ Monitors ============================
bind = SUPER CTRL, H, focusmonitor, l
bind = SUPER CTRL, J, focusmonitor, d
bind = SUPER CTRL, K, focusmonitor, u
bind = SUPER CTRL, L, focusmonitor, r
bind = SUPER CTRL, Left, focusmonitor, l
bind = SUPER CTRL, Down, focusmonitor, d
bind = SUPER CTRL, Up, focusmonitor, u
bind = SUPER CTRL, Right, focusmonitor, r

bind = SUPER SHIFT CTRL, H, movewindow, mon:l
bind = SUPER SHIFT CTRL, J, movewindow, mon:d
bind = SUPER SHIFT CTRL, K, movewindow, mon:u
bind = SUPER SHIFT CTRL, L, movewindow, mon:r

# ============================ Layout ============================
bind = SUPER, F, fullscreen, 1
bind = SUPER SHIFT, F, fullscreen, 0
bind = SUPER CTRL, F, fullscreen, 1
bind = SUPER SHIFT, T, togglefloating,
bind = SUPER, W, togglegroup,
bind = SUPER, Period, togglefloating,
bind = SUPER, BracketLeft, movewindow, l
bind = SUPER, BracketRight, movewindow, r
# ---- Resize ----
# Width:  Super+Minus shrink  |  Super+Plus / Super+Equal grow
# Height: Super+Shift+Minus shrink  |  Super+Shift+Plus / Super+Shift+Equal grow
# Italian-layout note: "-" is the bottom-row minus key, "+" is the key right of è,
# "=" is Shift+0, Shift+"-" is underscore, Shift+"+" is asterisk. The underscore /
# asterisk aliases keep the height binds reachable on that layout.
binde = SUPER, Minus, resizeactive, -10% 0
binde = SUPER, Plus, resizeactive, 10% 0
binde = SUPER, Equal, resizeactive, 10% 0
binde = SUPER SHIFT, Minus, resizeactive, 0 -10%
binde = SUPER SHIFT, underscore, resizeactive, 0 -10%
binde = SUPER SHIFT, Plus, resizeactive, 0 10%
binde = SUPER SHIFT, asterisk, resizeactive, 0 10%
binde = SUPER SHIFT, Equal, resizeactive, 0 10%
bind = SUPER, Q, killactive,
bind = SUPER SHIFT, E, exit,

# ============================ Mouse ============================
# Super+left-drag moves a window; Super+right-drag resizes it.
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# ============================ Resize submap ============================
# Super+R enters resize mode. H/J/K/L or arrows resize the active window;
# Esc / Enter / Space exits. Works on tiled and floating windows.
bind = SUPER, R, submap, resize

submap = resize
binde = , H, resizeactive, -4% 0
binde = , L, resizeactive, 4% 0
binde = , J, resizeactive, 0 4%
binde = , K, resizeactive, 0 -4%
binde = , Left, resizeactive, -4% 0
binde = , Right, resizeactive, 4% 0
binde = , Down, resizeactive, 0 4%
binde = , Up, resizeactive, 0 -4%
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ============================ DMS shell ============================
bind = SUPER, Space, exec, dms ipc call dankMenu toggle root
# Super+Tab is workspace cycling now (see Workspaces). Overview stays on Super+O
# and F3.
bind = SUPER, O, exec, dms ipc call hypr toggleOverview
bind = SUPER, A, exec, dms ipc call control-center toggle
bind = SUPER, D, exec, dms-dash-toggle
bind = SUPER, Z, exec, dms ipc call spotlight toggle
bind = SUPER, V, exec, dms ipc call clipboard toggle
bind = SUPER, N, exec, dms ipc call notepad toggle
bind = SUPER SHIFT, N, exec, dms ipc call notepad toggleExpand
bind = SUPER, X, exec, dms ipc call powermenu toggle
bind = SUPER, Comma, exec, dms ipc call settings focusOrToggle
bind = SUPER SHIFT, W, exec, dms ipc call window-rules toggle
bind = SUPER SHIFT, C, exec, dms ipc call color-picker toggle
bind = SUPER CTRL, N, exec, dms ipc call notifications toggle
bind = SUPER ALT, I, exec, dms ipc call inhibit toggle
bind = SUPER ALT, L, exec, dms ipc call lock lock
bind = SUPER ALT, N, exec, dms ipc call night toggle
bind = SUPER ALT, R, exec, dms ipc call workspace-rename open
bind = SUPER, P, exec, dms ipc call outputs cycleProfile
bind = SUPER, Backslash, exec, dms screenshot window
bind = , Print, exec, dms screenshot
bind = CTRL, Print, exec, dms screenshot full
bind = CTRL ALT, Delete, exec, dms ipc call processlist focusOrToggle
bind = CTRL ALT, M, exec, dms ipc call processlist focusOrToggle
bind = ALT, Space, exec, dms ipc call spotlight-bar toggle
bind = SUPER, Y, exec, dms ipc call keybinds toggle hypr
bind = SUPER, Return, exec, alacritty
bind = SUPER, T, exec, alacritty
bind = SUPER, E, exec, firefox
bind = SUPER, B, exec, thunar

# ============================ MacBook function row ============================
# Plain press = F1..F12 (hid_apple fnmode=2)
binde = , F1, exec, dms ipc call brightness decrement 5
binde = , F2, exec, dms ipc call brightness increment 5
bind = , F3, exec, dms ipc call hypr toggleOverview
bind = , F4, exec, dms ipc call spotlight toggle
binde = , F5, exec, brightnessctl -d smc::kbd_backlight set 10%-
binde = , F6, exec, brightnessctl -d smc::kbd_backlight set 10%+
bind = , F7, exec, dms ipc call mpris previous
bind = , F8, exec, dms ipc call mpris playPause
bind = , F9, exec, dms ipc call mpris next
bind = , F10, exec, dms ipc call audio mute
binde = , F11, exec, dms ipc call audio decrement 3
binde = , F12, exec, dms ipc call audio increment 3

# Fn+key = XF86 media keysyms (same actions)
binde = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5
binde = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5
binde = , XF86KbdBrightnessDown, exec, brightnessctl -d smc::kbd_backlight set 10%-
binde = , XF86KbdBrightnessUp, exec, brightnessctl -d smc::kbd_backlight set 10%+
bind = , XF86AudioPrev, exec, dms ipc call mpris previous
bind = , XF86AudioPlay, exec, dms ipc call mpris playPause
bind = , XF86AudioPause, exec, dms ipc call mpris playPause
bind = , XF86AudioNext, exec, dms ipc call mpris next
bind = , XF86AudioMute, exec, dms ipc call audio mute
binde = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
binde = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
