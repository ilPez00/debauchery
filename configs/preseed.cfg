# Debian 13 (trixie) netinst preseed for debauchery bootstrap
# Rendered at runtime: __USER__, __PASSWORD_HASH__ and __SSH_PUBKEY__ are substituted.
# NEVER commit a real password hash or a private key. Generate the hash with:
#   mkpasswd -m sha-512
# The harness generates a THROWAWAY ed25519 keypair per run for the ssh gate.

d-i debian-installer/locale string en_US
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i localechooser/supported-locales multiselect en_US.UTF-8

d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/layoutcode string us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debauchery-vm
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain string local
d-i netcfg/dhcp_timeout string 60

# Clock and time
d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

# Partitioning: guided LVM, entire disk
d-i partman-auto/disk string /dev/vda
d-i partman-auto/method string lvm
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Root password disabled (sudo via user)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string debauchery user
d-i passwd/username string __USER__
d-i passwd/user-password-crypted password __PASSWORD_HASH__
d-i user-setup/encrypt-home boolean false

# Apt setup
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i hw-detect/load_firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org
d-i apt-setup/security_path string /debian-security

# Package selection: no desktop task, ssh server only
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string sudo git curl ca-certificates gnupg
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string /dev/vda

# Late command: clone repo, create first-boot service via printf (no heredoc), enable it, wire first boot, inject gate key.
d-i preseed/late_command string \
  in-target mkdir -p /home/__USER__; \
  in-target git clone https://github.com/ilPez00/debauchery.git /home/__USER__/debauchery; \
  in-target chown -R __USER__:__USER__ /home/__USER__/debauchery; \
  in-target mkdir -p /etc/systemd/system; \
  in-target bash -c "printf '[Unit]\\nDescription=Debauchery first-boot bootstrap\\nAfter=network-online.target\\nWants=network-online.target\\n\\n[Service]\\nType=oneshot\\nExecStart=/home/__USER__/debauchery/bootstrap.sh --user __USER__ --yes --autologin --omarchy-binds\\nStandardOutput=journal\\nStandardError=journal\\n\\n[Install]\\nWantedBy=multi-user.target\\n' > /etc/systemd/system/debauchery-bootstrap.service"; \
  in-target systemctl enable debauchery-bootstrap.service; \
  in-target systemctl enable ly@tty1.service; \
  in-target systemctl disable getty@tty1.service; \
  in-target bash -c "mkdir -p /home/__USER__/.ssh && echo '__SSH_PUBKEY__' >> /home/__USER__/.ssh/authorized_keys && chmod 700 /home/__USER__/.ssh && chmod 600 /home/__USER__/.ssh/authorized_keys && chown -R __USER__:__USER__ /home/__USER__/.ssh"

# Finish — POWER OFF, not reboot: the harness boots with -kernel (d-i), and a
# reboot would reload the installer and loop forever. The harness detects the
# poweroff, then boots the installed disk without -kernel.
d-i debian-installer/exit/poweroff boolean true
d-i finish-install/reboot_in_progress note