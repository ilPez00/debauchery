# binds.omarchy.conf — Omarchy's default keys on air (Hyprland + DMS + Debian).
#
# Profile: omarchy. Install with:  ~/debauchery/install.sh binds omarchy
# Back to the niri layout:         ~/debauchery/install.sh binds niri
# Deployed to ~/.config/hypr/binds.conf, sourced by hyprland.conf.
#
# The key list is upstream Omarchy's (config/hypr/default/bindings/*.lua), not a
# guess. Where Omarchy's own shell command has no Debian equivalent, the bind
# calls the matching omarchy-<verb> shim, which maps to DMS IPC or a Debian
# tool. Deliberate deviations are marked D1.. and explained in docs/CONTRACT.md.
#
# Syntax: bind = MODS, key, dispatcher, arg   (binde = repeat while held)

# ============================ Workspaces ============================
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

bind = SUPER, Tab, workspace, e+1
bind = SUPER SHIFT, Tab, workspace, e-1
bind = SUPER CTRL, Tab, workspace, previous

# Omarchy: Super+S scratchpad, Super+grave quake console
bind = SUPER, S, togglespecialworkspace, scratchpad
bind = SUPER ALT, S, movetoworkspacesilent, special:scratchpad
bind = SUPER, grave, togglespecialworkspace, qconsole
bind = SUPER SHIFT, grave, movetoworkspacesilent, special:qconsole

# ============================ Windows ============================
# Omarchy binds both Q and W to close.
bind = SUPER, Q, killactive,
bind = SUPER, W, killactive,
bind = CTRL ALT, Delete, exec, omarchy-window-close-all

# Omarchy: Super+T toggles floating (the terminal is Super+Return there too).
bind = SUPER, T, togglefloating,
bind = SUPER, P, pseudo,
bind = SUPER, J, layoutmsg, togglesplit,
bind = SUPER, F, fullscreen, 1
bind = SUPER CTRL, F, fullscreen, 1
bind = SUPER ALT, F, fullscreen, 1

# D1: Omarchy's Super+O pops a window out; air keeps DMS overview, which is the
# more useful action on a 1440x900 laptop and has no Hyprland primitive.
bind = SUPER, O, exec, dms ipc call hypr toggleOverview

# Layout cycling: Omarchy's Super+L, implemented as a dwindle<->master toggle.
bind = SUPER, L, exec, omarchy-layout-toggle

# ALT+Tab window cycling (Omarchy default).
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# ============================ Focus ============================
bind = SUPER, Left, movefocus, l
bind = SUPER, Right, movefocus, r
bind = SUPER, Up, movefocus, u
bind = SUPER, Down, movefocus, d
# H/J/K/L are Omarchy bindings, so vim focus lives in the niri profile only.

# ============================ Move / swap ============================
bind = SUPER SHIFT, Left, swapwindow, l
bind = SUPER SHIFT, Right, swapwindow, r
bind = SUPER SHIFT, Up, swapwindow, u
bind = SUPER SHIFT, Down, swapwindow, d

bind = SUPER SHIFT CTRL, Left, movewindow, mon:l
bind = SUPER SHIFT CTRL, Right, movewindow, mon:r
bind = SUPER SHIFT CTRL, Up, movewindow, mon:u
bind = SUPER SHIFT CTRL, Down, movewindow, mon:d
bind = SUPER CTRL, Left, focusmonitor, l
bind = SUPER CTRL, Right, focusmonitor, r

# ============================ Resize ============================
bind = SUPER, R, submap, resize
submap = resize
binde = , H, resizeactive, -4% 0
binde = , L, resizeactive, 4% 0
binde = , J, resizeactive, 0 4%
binde = , K, resizeactive, 0 -4%
binde = , Left, resizeactive, -4% 0
binde = , Right, resizeactive, 4% 0
binde = , Down, resizeactive, 0 4%
binde = , Up, resizeactive, 0 -4%
bind = , Escape, submap, reset
bind = , Return, submap, reset
bind = , Space, submap, reset
submap = reset

# ============================ Omarchy menus ============================
bind = SUPER, Space, exec, omarchy-menu
bind = SUPER, Escape, exec, omarchy-menu-power
bind = SUPER, K, exec, omarchy-menu-keybindings
bind = SUPER, Y, exec, dms ipc call keybinds toggle hypr
bind = SUPER, A, exec, dms ipc call control-center toggle
bind = SUPER, X, exec, omarchy-menu-power
bind = SUPER, D, exec, dms-dash-toggle
bind = SUPER, Z, exec, dms ipc call spotlight toggle
bind = SUPER, N, exec, dms ipc call notepad toggle
bind = SUPER SHIFT, N, exec, dms ipc call notepad toggleExpand
bind = SUPER, V, exec, omarchy-menu-clipboard
bind = SUPER, Comma, exec, omarchy-notifications-toggle
bind = SUPER CTRL, Comma, exec, dms ipc call settings focusOrToggle
bind = SUPER SHIFT, C, exec, dms ipc call color-picker toggle
bind = SUPER SHIFT, W, exec, dms ipc call window-rules toggle
bind = SUPER ALT, I, exec, dms ipc call inhibit toggle
bind = SUPER ALT, L, exec, dms ipc call lock lock
bind = SUPER ALT, N, exec, dms ipc call night toggle
bind = SUPER ALT, R, exec, dms ipc call workspace-rename open
bind = SUPER ALT, P, exec, dms ipc call outputs cycleProfile
# D4: Omarchy sends email on Super+Shift+E; air keeps its session exit there.
bind = SUPER SHIFT, E, exit,
# Physis (Super+Shift+P/G/O) is bound by ~/.config/hypr/physis-omarchy.conf,
# which extra.conf sources last — deliberately not duplicated here.

# ============================ Screenshots ============================
bind = , Print, exec, omarchy-capture-screenshot
bind = SUPER, Print, exec, dms ipc call color-picker toggle
bind = SUPER CTRL, Print, exec, omarchy-capture-text
bind = ALT, Print, exec, omarchy-capture-screenrecording
bind = SUPER, Backslash, exec, dms screenshot window

# ============================ Apps ============================
bind = SUPER, Return, exec, alacritty
bind = SUPER SHIFT, Return, exec, firefox
bind = SUPER SHIFT, B, exec, firefox
# D5: Super+E is unbound in Omarchy; kept here from air's habit.
bind = SUPER, E, exec, firefox
bind = SUPER SHIFT, F, exec, thunar
bind = SUPER, B, exec, thunar
bind = CTRL ALT, M, exec, dms ipc call processlist focusOrToggle

# ============================ Mouse ============================
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow
bind = SUPER, mouse_up, workspace, e-1
bind = SUPER, mouse_down, workspace, e+1

# ============================ MacBook function row ============================
# hid_apple fnmode=2: plain press = F1..F12, Fn+key = XF86 media keysyms.
binde = , F1, exec, omarchy-brightness-display -5%
binde = , F2, exec, omarchy-brightness-display +5%
bind = , F3, exec, dms ipc call hypr toggleOverview
bind = , F4, exec, dms ipc call spotlight toggle
binde = , F5, exec, omarchy-brightness-keyboard down
binde = , F6, exec, omarchy-brightness-keyboard up
bind = , F7, exec, omarchy-media previous
bind = , F8, exec, omarchy-media play-pause
bind = , F9, exec, omarchy-media next
bind = , F10, exec, dms ipc call audio mute
binde = , F11, exec, omarchy-audio-output-volume -3
binde = , F12, exec, omarchy-audio-output-volume +3

bind = , XF86PowerOff, exec, omarchy-menu-power
binde = , XF86MonBrightnessDown, exec, omarchy-brightness-display -5%
binde = , XF86MonBrightnessUp, exec, omarchy-brightness-display +5%
bind = SHIFT, XF86MonBrightnessDown, exec, dms ipc call brightness set 1%
bind = SHIFT, XF86MonBrightnessUp, exec, dms ipc call brightness set 100%
bind = ALT, XF86MonBrightnessDown, exec, omarchy-brightness-display -1%
bind = ALT, XF86MonBrightnessUp, exec, omarchy-brightness-display +1%
binde = , XF86KbdBrightnessDown, exec, omarchy-brightness-keyboard down
binde = , XF86KbdBrightnessUp, exec, omarchy-brightness-keyboard up
bind = , XF86AudioPrev, exec, omarchy-media previous
bind = , XF86AudioPlay, exec, omarchy-media play-pause
bind = , XF86AudioPause, exec, omarchy-media play-pause
bind = , XF86AudioNext, exec, omarchy-media next
bind = , XF86AudioMute, exec, dms ipc call audio mute
bind = SHIFT, XF86AudioMute, exec, omarchy-audio-output-switch
bind = , XF86AudioMicMute, exec, omarchy-audio-input-mute
binde = , XF86AudioLowerVolume, exec, omarchy-audio-output-volume -3
binde = , XF86AudioRaiseVolume, exec, omarchy-audio-output-volume +3
bind = ALT, XF86AudioLowerVolume, exec, omarchy-audio-output-volume -1
bind = ALT, XF86AudioRaiseVolume, exec, omarchy-audio-output-volume +1
bind = , XF86TouchpadToggle, exec, omarchy-toggle-touchpad
bind = , XF86TouchpadOn, exec, omarchy-toggle-touchpad on
bind = , XF86TouchpadOff, exec, omarchy-toggle-touchpad off

# arch menu (omarchy-rice)
bind = SUPER, M, exec, alacritty --class rice -e omarchy-rice
