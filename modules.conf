# modules.conf — the single source of truth for what `install.sh` can do.
#
# Format, `|` separated, order = execution order:
#   id | script | scope | profiles | check
#
#   script   path relative to this repo, or `-` for a step implemented natively
#            in install.sh (deploy + zshrc wiring, binds profile).
#   scope    user  — runs as you
#            root  — runs under sudo (skipped by --no-sudo)
#   profiles comma list; `all` means every profile
#   check    bash command, run read-only by `doctor` / `status`
#            exit 0 = installed/healthy
#
# Profiles: core (bridge + aliases), feel (Hyprland + shims + binds),
# arch (container + AUR tools), apple (MacBook function row), all.

backup   |scripts/backup-desktop.sh   |user|core,feel,arch,apple,all|test -d "$HOME/debauchery/backups"
bridge   |scripts/08-arch-bridge.sh   |user|core,feel,arch,all      |bash -c '"$HOME/.local/bin/omarchy-arch" --status >/dev/null 2>&1'
ssh      |scripts/09-ssh-aliases.sh   |user|core,feel,arch,all      |bash -c 'grep -qF ssh-aliases.zsh "$HOME/.zshrc" 2>/dev/null'
zsh      |-                           |user|core,feel,arch,all      |test -f "$HOME/.config/debauchery/aliases.zsh"
hyprland |scripts/01-hyprland-install.sh|root|feel,all              |command -v Hyprland
hyprcfg  |scripts/02-hyprland-config.sh|user|feel,all               |bash -c 'Hyprland --verify-config -c "$HOME/.config/hypr/hyprland.conf" >/dev/null 2>&1'
binds    |-                           |user|feel,all                |test -f "$HOME/.config/hypr/binds.conf"
shims    |scripts/11-omarchy-shims.sh |user|feel,all                |test -x "$HOME/.local/bin/omarchy-menu"
physis   |scripts/06-physis-adapter.sh|user|feel,all                |test -x "$HOME/.local/bin/physis-omarchy"
archbox  |scripts/03-arch-distrobox.sh|root|arch,all                |bash -c 'cd "$HOME" && distrobox list 2>/dev/null | grep -q "| arch-omarchy "'
tools    |scripts/10-omarchy-tools.sh |user|arch,all                |bash -c '"$HOME/.local/bin/omarchy-pkg" present impala >/dev/null 2>&1'
fnrow    |scripts/05-function-row.sh  |user|apple,all               |test "$(cat /sys/module/hid_apple/parameters/fnmode 2>/dev/null)" = 2
